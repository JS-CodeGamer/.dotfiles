<* for name, value in colors *>

${{ name }} = {{ value.default.rgba }}
${{ name }}_50_opacity = {{ value.default.rgba | set_alpha: 0.5 }}

<* endfor *>

$on_surface_2 = {{ colors.on_surface.default.rgba | auto_lightness: 5.0 }}
$on_surface_variant_2 = {{ colors.on_surface.default.rgba | auto_lightness: 5.0 }}

$wallpaper = {{ image }}
