[config]
version_check = false
caching = true
prefer = "closest-to-fallback"
fallback_color = "#8d02f7"
expr_prefix = "{{"
expr_postfix = "}}"
block_prefix = "<*"
block_postfix = "*>"

[templates.ghostty]
input_path = "templates/ghostty.toml"
output_path = "~/.config/ghostty/themes/from-matugen"

[templates.gtk3]
input_path = "templates/gtk.css"
output_path = "~/.config/gtk-3.0/theme.css"

[templates.gtk4]
input_path = "templates/gtk.css"
output_path = "~/.config/gtk-4.0/theme.css"

[templates.qt5ct]
input_path = "templates/qt5ct.conf"
output_path = "~/.config/qt5ct/colors/theme.conf"

[templates.qt6ct]
input_path = "templates/qt5ct.conf"
output_path = "~/.config/qt6ct/colors/theme.conf"

[templates.hyprlock]
input_path = "templates/hyprlock.conf"
output_path = "~/.config/hypr/hyprlock/theme.conf"

[templates.niri]
input_path = "templates/niri.kdl"
output_path = "~/.config/niri/theme.kdl"

[templates.bar]
input_path = "templates/bar.css"
output_path = "~/.config/bar.css"
