# SYSTEM/MEDIA STATUS CARD
shape {
    monitor =
    size = 360, 320
    color = $surface_variant_50_opacity
    rounding = 25
    position = 250, -60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shadow
    zindex = 10
}

# Media Info
label {
    monitor =
    text = cmd[update:1000] player=$(playerctl -l 2>/dev/null | head -n 1); if [ "$player" = "spotify" ]; then echo " <b> </b> "; elif [ -n "$player" ]; then echo "  "; else echo " 󰎆 "; fi
    color = $on_surface_variant
    font_size = 18
    font_family = $font_fam
    position = 250, 70
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:1000] title=$(playerctl metadata xesam:title 2>/dev/null | cut -c1-24); if [ -z "$title" ]; then echo "No Music Playing"; else echo "$title"; fi
    color = $on_surface_variant
    font_size = 14
    font_family = $font_fam
    position = 250, 40
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:1000] artist=$(playerctl metadata xesam:artist 2>/dev/null | cut -c1-30); if [ -z "$artist" ]; then echo ""; else echo "$artist"; fi
    color = $on_surface_variant_2
    font_size = 12
    font_family = $font_fam
    position = 250, 20
    halign = center
    valign = center
    zindex = 11
}

# Connectivity Buttons
shape {
    monitor =
    size = 150, 75
    color = $tertiary
    rounding = 20
    position = 165, -50
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text =  <b></b>
    color = $on_tertiary
    font_size = 20
    font_family = $font_fam
    position = 165, -40
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] wifi=$(iw dev 2>/dev/null | awk '$1=="ssid"{print $2}' | head -n 1 | cut -c1-14); if [ -z "$wifi" ]; then echo "Disconnected"; else echo "$wifi"; fi
    color = $on_tertiary
    font_size = 10
    font_family = $font_fam
    position = 165, -60
    halign = center
    valign = center
    zindex = 12
}

shape {
    monitor =
    size = 150, 75
    color = $tertiary
    rounding = 20
    position = 335, -50
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text =  <b></b>
    color = $on_tertiary
    font_size = 20
    font_family = $font_fam
    position = 335, -40
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] bt=$(bluetoothctl info 2>/dev/null | grep "Name:" | cut -d ' ' -f 2- | cut -c 1-14); if [ -z "$bt" ]; then echo "Disconnected"; else echo "$bt"; fi
    color = $on_tertiary
    font_size = 10
    font_family = $font_fam
    position = 335, -60
    halign = center
    valign = center
    zindex = 12
}

# Battery Bar
shape {
    monitor =
    size = 320, 100
    color = $primary
    rounding = 25
    position = 250, -155
    halign = center
    valign = center
    zindex = 11
}

# Battery Inner icon block
shape {
    monitor =
    size = 100, 20
    color = $on_tertiary
    rounding = 5
    position = 250, -125
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] status=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); if [ "$status" = "Discharging" ]; then echo " <b>!</b> "; else echo " <b>󰚥</b> "; fi
    color = $primary
    font_size = 12
    font_family = $font_fam
    position = 250, -125
    halign = center
    valign = center
    zindex = 13
}

label {
    monitor =
    text = cmd[update:1000] cat /sys/class/power_supply/BAT0/capacity | sed 's/.*/<b>&%<\/b>/'
    color = $on_tertiary
    font_size = 24
    font_family = $font_fam
    position = 250, -155
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] cat /sys/class/power_supply/BAT0/status
    color = $on_tertiary
    font_size = 10
    font_family = $font_fam
    position = 250, -185
    halign = center
    valign = center
    zindex = 12

